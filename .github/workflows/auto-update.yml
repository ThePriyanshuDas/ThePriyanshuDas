name: Auto Contribution

on:
  schedule:
    - cron: "0 4,10,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 🔥 REQUIRED

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # 🔥 IMPORTANT

      - name: Make update
        run: |
          echo "Update at $(date)" >> activity_log.txt

      - name: Commit changes
        run: |
          git config --global user.name "ThePriyanshuDas"
          git config --global user.email "priyanshudas030@gmail.com"
          git add activity_log.txt
          git commit -m "Auto update: $(date)" || echo "No changes"

      - name: Push changes
        run: |
          git push